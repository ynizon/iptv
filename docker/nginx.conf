# The web server: the static files and the pictures already made directly, the rest to PHP-FPM
server {
    listen 80 default_server;
    root /var/www/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # Posters and logos already resized: no PHP, kept by the browser (their address changes with the poster).
    # The others are downloaded and resized by the application
    location ~ ^/picture/(\d+)$ {
        try_files /images/playlist/$1/logo.jpg /images/playlist/$1/$1.jpg /index.php?$query_string;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:css|js|webp|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        try_files $uri /index.php?$query_string;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # A picture can take 10 s to download
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
